[package]
name = "markdown-viewer"
version = "2.0.0"
description = "超軽量 Markdown ビューアー (Tauri v2)"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "markdown_viewer_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
encoding_rs = "0.8"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"

# 配布サイズ最優先のリリースプロファイル
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
incremental = true
