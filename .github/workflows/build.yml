# Windows (素の exe) / macOS (.app, Universal) / Linux (AppImage) を CI でビルドする。
# 手動実行 (workflow_dispatch) か v* タグの push で動く。
name: build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            args: --no-bundle
            targets: ''
          - os: macos-latest
            name: macos-universal
            args: --target universal-apple-darwin --bundles app
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: ubuntu-22.04
            name: linux-x64
            args: --bundles appimage
            targets: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Linux 依存パッケージ
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npx tauri build ${{ matrix.args }}

      - name: macOS .app を zip 化
        if: runner.os == 'macOS'
        run: |
          cd src-tauri/target/universal-apple-darwin/release/bundle/macos
          ditto -c -k --keepParent MarkdownViewer.app ../../../../../../MarkdownViewer-macos-universal.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MarkdownViewer-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/MarkdownViewer.exe
            src-tauri/target/release/markdown-viewer.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
            MarkdownViewer-macos-universal.zip
